<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hajózási zászló-ábécé fordító — Teljes specifikáció</title>
<style>
  :root {
    --bg: #0e1116; --card: #161b24; --line: #262d3a;
    --fg: #e9ecf1; --mut: #9aa3b2; --acc: #FF5100;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.72 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 22px 90px; }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: rgba(14,17,22,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); margin: -28px -22px 26px;
    padding: 12px 22px; display: flex; align-items: center; gap: 12px;
  }
  .topbar a {
    color: var(--mut); text-decoration: none; font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px;
    background: var(--card); transition: .15s;
  }
  .topbar a:hover { color: #fff; border-color: var(--acc); }
  .topbar .sp { flex: 1; }
  .topbar .tt { font-size: 13px; color: var(--mut); }

  h1 {
    font-size: 27px; line-height: 1.3; margin: 6px 0 10px; letter-spacing: -.4px;
  }
  h1 + p { color: var(--mut); font-size: 14px; margin: 0 0 8px; }
  h2 {
    font-size: 19px; margin: 38px 0 12px; padding: 10px 14px; color: #fff;
    background: rgba(255,81,0,.10); border-left: 3px solid var(--acc);
    border-radius: 0 9px 9px 0;
  }
  h3 {
    font-size: 16.5px; margin: 26px 0 8px; color: var(--acc);
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  h4 { font-size: 15px; margin: 20px 0 6px; color: #dfe4ec; }
  p { margin: 10px 0; }
  ul, ol { margin: 10px 0 10px 3px; padding-left: 20px; }
  li { margin: 5px 0; }
  li::marker { color: var(--acc); }
  strong { color: #fff; }
  em { color: var(--mut); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 30px 0; }
  a { color: #ff8a4c; }
  code {
    background: #0a0d12; border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 6px; font-size: 12.8px; font-family: ui-monospace, SFMono-Regular,
      Menlo, monospace; color: #ffb08a;
  }
  pre {
    background: #0a0d12; border: 1px solid var(--line); border-radius: 11px;
    padding: 14px 16px; overflow-x: auto; margin: 14px 0;
  }
  pre code { background: none; border: 0; padding: 0; color: #cfd6e2; font-size: 12.8px; }
  blockquote {
    margin: 16px 0; padding: 13px 17px; background: rgba(255,81,0,.07);
    border-left: 3px solid var(--acc); border-radius: 0 9px 9px 0;
    font-style: italic; color: #eae0da;
  }
  table {
    border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13.6px;
  }
  th, td {
    border: 1px solid var(--line); padding: 9px 11px; text-align: left;
    vertical-align: top;
  }
  th { background: #1c222d; font-weight: 650; color: #fff; }
  tr:nth-child(even) td { background: rgba(255,255,255,.018); }
  .foot {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line);
    color: var(--mut); font-size: 12.8px; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="./">← Vissza az Ötletlátába</a>
    <span class="sp"></span>
    <span class="tt">📄 Teljes specifikáció</span>
  </div>

  <div id="tartalom">Betöltés…</div>

</div>

<script src="markdown-spec.js"></script>
<script src="spec-zaszlo-abc-szoveg.js"></script>
<script>
/* a specifikáció szövegét külön fájlból töltjük (nincs szerver, ezért beágyazva) */
(function () {
  const szoveg = (window.SPEC_SZOVEG || "").trim();
  document.getElementById("tartalom").innerHTML = mdSpec(szoveg);
  document.title = "Hajózási zászló-ábécé fordító — Teljes specifikáció";
})();
</script>
</body>
</html>
